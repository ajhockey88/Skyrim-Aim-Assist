; Aim Assist for Skyrim - controller only (right stick). Keyboard/mouse is never touched.

[General]
; Master switch
Enabled = true
; Only assist while a weapon/spell is drawn
RequireWeaponDrawn = true
; true = only bows, crossbows and spells. false = melee too.
BowsAndSpellsOnly = true
; Only assist toward actors hostile to you
HostileOnly = true
; Target must be visible (line of sight)
RequireLineOfSight = true
; Maximum target distance in game units (~70 units = 1 meter)
MaxDistance = 4000

[Targeting]
; Half-angle of the assist cone around the crosshair, in degrees
ConeDegrees = 10.0
; Where on the body to aim, as a fraction of height (0.0 feet, 1.0 head)
AimHeight = 0.7

[Friction]
; Slows camera turn speed while the crosshair is near a target
Enabled = true
; 0.0 = none, 1.0 = very sticky. Strongest at the center of the cone.
Strength = 0.45

[Magnetism]
; Gently pulls the crosshair toward the target while you move the right stick
Enabled = true
; Higher = stronger pull. Try 2 to 12.
Strength = 5.0
; Only pull while the right stick is being moved
RequireStickInput = true
; If the pull goes the wrong direction on your setup, flip these
InvertYaw = false
InvertPitch = false
