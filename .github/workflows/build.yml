name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version tag to release, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  VCPKG_ROOT: C:\vcpkg

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin Color-Glass vcpkg registry baseline
        shell: bash
        run: |
          BASELINE=$(git ls-remote https://gitlab.com/colorglass/vcpkg-colorglass HEAD | cut -f1)
          echo "Using baseline '$BASELINE'"
          test -n "$BASELINE"
          VCPKG_BASELINE=$(git ls-remote https://github.com/microsoft/vcpkg HEAD | cut -f1)
          echo "Using vcpkg baseline '$VCPKG_BASELINE'"
          test -n "$VCPKG_BASELINE"
          sed -i "s/__BASELINE__/$BASELINE/; s/__VCPKG_BASELINE__/$VCPKG_BASELINE/" vcpkg-configuration.json
          cat vcpkg-configuration.json

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Use the git-based vcpkg on the runner
        shell: pwsh
        run: |
          # msvc-dev-cmd points VCPKG_ROOT at the copy bundled with Visual Studio, which is not a git checkout.
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT exists=$(Test-Path $env:VCPKG_ROOT)"
          cmake --preset release 2>&1 | Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content cfg.log -Tail 50) -join "%0A"
            Write-Host "::error title=Configure failed::$tail"
            $extra = Get-ChildItem -Path build, $env:VCPKG_ROOT\buildtrees -Recurse -Include *.log -ErrorAction SilentlyContinue | Select-Object -First 3
            foreach ($f in $extra) {
              $t = (Get-Content $f.FullName -Tail 30) -join "%0A"
              Write-Host "::error title=$($f.Name)::$t"
            }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content build.log
            $i = ($lines | Select-String -Pattern "^FAILED:" | Select-Object -First 1).LineNumber
            $ctx = $lines[($i-1)..([Math]::Min($i+14, $lines.Count-1))] | ForEach-Object { if ($_.Length -gt 220) { $_.Substring(0,220) } else { $_ } }
            Write-Host "::error title=First failure::$($ctx -join '%0A')"
            $inc = "build\vcpkg_installed\x64-windows-static-md\include"
            $pch = (Get-Content "$inc\SKSE\Impl\PCH.h" -TotalCount 80) -join "%0A"
            Write-Host "::error title=PCH.h head::$pch"
            $rel = (Get-Content "$inc\REL\Relocation.h" | Select-Object -Skip 1 -First 40) -join "%0A"
            Write-Host "::error title=Relocation.h head::$rel"
            $sky = (Get-Content "$inc\RE\Skyrim.h" -TotalCount 12) -join "%0A"
            Write-Host "::error title=Skyrim.h head::$sky"
            exit 1
          }

      - name: Package for Vortex
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter AimAssist.dll | Select-Object -First 1
          if (-not $dll) { throw "AimAssist.dll not found" }
          Copy-Item $dll.FullName package/SKSE/Plugins/AimAssist.dll
          Compress-Archive -Path package/* -DestinationPath AimAssist-1.0.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AimAssist-Vortex
          path: AimAssist-1.0.0.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: AimAssist-1.0.0.zip
          body_path: .github/release-notes/${{ inputs.release || github.ref_name }}.md
